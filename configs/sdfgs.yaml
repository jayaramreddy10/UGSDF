seed: 0
dataset: waymo/3cams

# ------------- Trainer ------------ #
trainer:
  type: models.trainers.MultiTrainer
  optim:
    num_iters: 30000
    use_grad_scaler: false
    cache_buffer_freq: -1 # if > 0, use error based image sampler for training
  render:
    near_plane: 0.1 # near plane for rendering
    far_plane: 10000000000.0 # far plane for rendering
    antialiased: false # whether to use antialiasing for gaussian rendering, supported by gsplat kernel
    packed: false # whether to use packed rendering, supported by gsplat kernel
    absgrad: true # whether to use absolute gradient for rendering, supported by gsplat kernel
    sparse_grad: false # whether to use sparse gradient for rendering, supported by gsplat kernel
    batch_size: 1 # batch size for rendering, currently only support 1
  losses:
    rgb:
      w: 0.8
    ssim:
      w: 0.2
    mask:
      w: 0.05
      opacity_loss_type: bce # choose from [bce, safe_bce]
    depth:
      w: 0.01 # weight of depth loss
      inverse_depth: False # whether to use inverse depth, NOTE that when set to True, must normalize=True
      normalize: False # whether to normalize depth loss
      loss_type: l1 # choose from ["l1", "l2"]
    affine:
      w: 0.00001 # weight of affine regularization
  res_schedule:
    double_steps: 250 # training starts at 1/d resolution, every n steps this is doubled
    downscale_times: 2 # at the beginning, resolution is 1/2^d, where d is this number
  gaussian_optim_general_cfg:
    xyz:
      lr: 1.6e-04
      lr_final: 1.6e-06
      scale_factor: scene_radius # str or float, if "scene_scale", scale the learning rate by the scene scale
    sh_dc:
      lr: 0.0025
    sh_rest:
      lr: 0.000125
    opacity:
      lr: 0.05
    scaling:
      lr: 0.005
    rotation:
      lr: 0.001
  gaussian_ctrl_general_cfg:
    warmup_steps: 500             # warmup steps for alpha
    reset_alpha_interval: 3000    # reset alpha every n steps
    refine_interval: 100          # refine gaussians every n steps
    sh_degree_interval: 1000      # every n intervals turn on another sh degree
    n_split_samples: 2            # number of samples to split gaussians into
    # may differ in different models
    reset_alpha_value: 0.01       # reset alpha to this value
    densify_grad_thresh: 0.0005   # above this grad, gaussians are densified
    densify_size_thresh: 0.003    # below this size, gaussians are *duplicated*, otherwise split
    cull_alpha_thresh: 0.005      # threshold of opacity for culling gaussians
    cull_scale_thresh: 0.5        # threshold of scale for culling gaussians
    cull_screen_size: 0.15        # if a gaussian is more than this percent of screen space, cull it
    split_screen_size: 0.05       # if a gaussian is more than this percent of screen space, split it
    stop_screen_size_at: 4000     # stop culling/splitting at this step WRT screen size of gaussians
    stop_split_at: 15000          # stop splitting at this step
    sh_degree: 3                  # sh degree for gaussians

# ------------- Model ------------ #
model:
  Background:
    type: models.gaussians.VanillaGaussians
    init:
      from_lidar:
        num_samples: 800_000
        return_color: True
      filter_moving_thres: 0.5 # also keep background out of moving boxes that have no node
      near_randoms: 100_000
      far_randoms: 100_000
    reg:
      sharp_shape_reg:
        w: 1.
        step_interval: 10
        max_gauss_ratio: 10.       # threshold of ratio of gaussian max to min scale before applying regularization loss from the PhysGaussian paper
      free_space: # LiDAR rays cast through a voxel grid; gaussians in voxels seen through and never hit are floaters
        w: 1.0 # weight of the opacity loss (mean opacity of the gaussians in free voxels)
        start: 500
        prune: true # also cull them at refinement
        prune_start: 3000
        voxel: 0.25 # metres
        max_range: 75.0
        min_traversal: 5.0 # ray length (in voxels) that must have crossed a voxel to call it free
        min_hits: 1 # static returns that make a voxel solid
        dilate: 1 # voxels around a solid voxel that are never free
        exclude_returns: modelled # returns on these boxes are not static: modelled | moving | none
        exclude_test_frames: true # held-out timesteps are not cast
  RigidNodes:
    type: models.nodes.SDFGSNodes
    sdf:
      net:
        hidden_dim: 128
        layers: 4
        frequencies: 4
        pad: 1.3 # box half-size times pad is the encoding's unit length
        box_shrink: 0.05 # the MLP is a residual over the SDF of the box shrunk by this (metres)
        box_clamp: 0.03 # metres; sdf = max(sdf, box grown by this): no surface outside the box (null disables)
      mesh:
        resolution: 192 # marching-cubes cells along the longest side (export and evaluation)
      register: # track: move each training frame's pose so its LiDAR returns sit on the SDF (needs supervision.follow_pose)
        enabled: false
        start: 5000
        every: 1000
        iters: 50
        step: 0.5 # fraction of the registration correction applied each time
        max_trans: 0.1 # metres, per registration
        max_rot_deg: 2.0
        min_returns: 30
      supervision:
        box_pad: 0.3 # metres around the box in which rays are kept
        ground_margin: 0.12 # returns this close to the box floor are treated as ground, not surface
        surface_tol: 0.02 # returns may lie this far outside the box and still count as surface
        max_rays_per_instance: 200000
        max_surface_per_instance: 100000
        use_masks: true # verify returns against the annotator masks, carve with pixels that see past the object
        mask_tol_px: 2 # a return may project this far outside the mask and still count as surface
        unverified_w: 0.35 # weight of returns no masked camera could check
        carve: true
        carve_dilate_px: 8 # carving pixels must be this far outside the mask (covers mask/undistortion slop)
        carve_pixels_per_view: 1500
        max_carve_rays_per_instance: 200000
        inside_erode_px: 4 # mask rays (loss.inside_w) come from pixels this far inside the mask
        follow_pose: false # re-place the stored rays/returns with the refined instance poses during training
        follow_pose_every: 100 # steps between re-placements
        exclude_test_frames: true # held-out timesteps give no SDF supervision
        withhold_side: null # experiment: drop every ray whose origin is on one side of an instance (auto | pos | neg | null); the dropped returns then score the unseen side
        withhold_min_returns: 300 # an instance takes part only if both of its flanks have this many returns
        withhold_band: 0.25 # metres from the box side that count as flank
      loss:
        surface_w: 1.0
        n_surface: 2048
        facing_w: 0.0 # the SDF normal at a return faces the sensor (0 disables)
        facing_margin: 0.0 # required cosine margin between the normal and the direction back to the sensor
        behind_w: 0.5 # TSDF-style band behind a return is interior
        behind_depth: 0.5
        free_w: 0.5
        n_free: 4096
        free_margin: 0.05
        outside_w: 0.5 # shell between box and padded box is free
        carve_w: 0.5 # camera rays that see past the object are free through the box
        eikonal_w: 0.1
        n_eikonal: 1024
        gs2sdf_w: 0.1 # opaque gaussian centres are surface samples
        gs2sdf_start: 1000
        gs2sdf_min_opacity: 0.3
        sdf2gs_w: 0.01 # pull gaussian centres onto the zero level
        sdf2gs_power: 1 # 1: |sdf|; 2: sdf^2 (pulls harder the farther a gaussian is; needs a weight ~50x larger to match |sdf| at 1 cm)
        sdf2gs_start: 3000
        align_w: 0.0 # turn the thinnest axis of gaussians near the surface along the SDF normal (0 disables)
        align_start: 3000
        align_band: 0.1 # metres from the zero level within which a gaussian is aligned
        inside_w: 0.0 # camera rays through the instance mask must reach a negative distance inside the box (0 disables)
        inside_margin: 0.02 # ... of at least this depth (metres)
        inside_samples: 16 # points per ray
        n_inside: 1024 # mask rays per step
        inside_start: 0
        n_gs: 2048
      prune:
        start: 3000
        tau: 0.2 # cull gaussians farther than this (metres) from the zero level
      mono: # monocular depth -> SDF: a lifted surface (tools/mono_depth/lift.py) supervises the SDF where LiDAR is lacking
        points: null # e.g. data/waymo/mono/{scene_idx:03d}/lifted_v2.npz (null disables)
        min_views: 3 # views that must have seen a lifted point
        min_facing: 3 # fused views the lifted normal must face (drops points seen only at grazing angles and wrongly oriented sheets; 0 keeps all)
        min_lidar_dist: 0.05 # lifted points nearer than this to a training return of the instance are dropped
        full_lidar_dist: 0.15 # the weight of the rest rises linearly to 1 at this distance from the nearest return
        free_tol: 0.03 # lifted points this close to a LiDAR free-space ray or a carving ray are dropped (0 keeps them)
        max_per_instance: 50000
        start: 0
        n: 1024 # lifted points per step
        surface_w: 0.3 # lifted points are on the zero level
        normal_w: 0.05 # the SDF gradient follows the lifted normal
        band_w: 0.15 # along the normal: free in front of the surface, interior behind it
        band_depth: 0.1 # metres on either side
      seed: # SDF -> new Gaussians: add Gaussians on the zero level where none covers it
        enabled: false
        start: 5000
        stop: 20000
        interval: 1000 # steps between seeding events (a multiple of the refine interval)
        radius: 0.05 # metres; surface cell size, and a cell is covered if a Gaussian of the instance is within this
        cover_sigma: 1.0 # a Gaussian also covers what is within `radius` of its ball of this many standard deviations (0: centres only)
        min_opacity: 0.0 # Gaussians below this opacity do not count as cover
        support: lidar # where the SDF counts as evidence: lidar (a training return nearby) | lidar_sym (or a mirrored one) | any
        support_radius: 0.05
        require_camera: true # only where training cameras face the surface point
        min_views: 3 # ... in at least this many views
        camera_min_cos: 0.2 # cosine between the surface normal and the direction to the camera
        camera_max_dist: 60.0
        n_samples: 40000 # random points per instance projected onto the zero level per event
        max_per_instance: 2000 # per event
        opacity: 0.1
        scale: 0.5 # disc radius as a fraction of `radius`
        flatten: 0.3 # thickness along the normal relative to the disc radius
      symmetry:
        enabled: true # apply the supervision mirrored about the object's x-z plane (left-right symmetry)
        w: 0.3 # weight of the mirrored terms relative to the real ones
        learn_plane: false # learn a per-instance offset of the symmetry plane along y (else the box's x-z plane)
        max_offset: 0.1 # bound on that offset (metres)
        plane_reg_w: 1.0 # keeps a learned plane at the box centre unless both sides are observed
        start: 0
    init:
      instance_max_pts: 5000 # max initial points for each instance
      only_moving: true # only optimize moving instances
      traj_length_thres: 1.0 # threshold of trajectory length for moving instances
      annotator_masks: ../MaskPtAnnotator/annotator_output/{scene_idx:03d}/masks_npz # only instances with annotator masks
      mono_points: null # lifted monocular-depth points (tools/mono_depth/lift.py), e.g. data/waymo/mono/{scene_idx:03d}/lifted.npz
      mono_min_lidar_dist: 0.05 # only lifted points farther than this from every LiDAR point of the instance are added
      mono_max_pts: 5000 # per instance
      mono_min_views: 3
    ctrl:
      cull_scale_thresh: 0.1
      stop_screen_size_at: 30000
      stop_split_at: 20000
      cull_out_of_bound: true
    reg:
      sharp_shape_reg:
        w: 1.
        step_interval: 10
        max_gauss_ratio: 10.
      temporal_smooth_reg:
        trans:
          w: 0.01 # optimal value may vary
          smooth_range: 5 # no ablation
    optim:
      ins_rotation:
        lr: 0.00001
        lr_final: 0.000005
      ins_translation:
        lr: 0.0005
        lr_final: 0.0001
      sdf:
        lr: 0.001
        lr_final: 0.0001
  DeformableNodes:
    type: models.nodes.DeformableNodes
    init:
      instance_max_pts: 5000
      only_moving: true
      traj_length_thres: 0.5
      annotator_masks: ../MaskPtAnnotator/annotator_output/{scene_idx:03d}/masks_npz # only instances with annotator masks
    networks:
      D: 8
      W: 256
      embed_dim: 16
      x_multires: 10                # default 10
      t_multires: 10                # default 10
      deform_quat: True
      deform_scale: False
    ctrl:
      reset_alpha_value: 0.1
      cull_scale_thresh: 0.1
      stop_screen_size_at: 30000
      stop_split_at: 20000
      sh_degree: 3
      cull_out_of_bound: false
      use_deformgs_for_nonrigid: True # default True
      use_deformgs_after: 3000        # default 3000
      stop_optimizing_canonical_xyz: True
    reg:
      sharp_shape_reg:
        w: 1.
        step_interval: 10
        max_gauss_ratio: 10.
      out_of_bound_loss:
        w: 1.
        stop_after: 30000
      temporal_smooth_reg:
        trans:
          w: 0.01 # optimal value may vary
          smooth_range: 5 # optimal value may vary
    optim:
      xyz:
        lr: 1.6e-04
        lr_final: 1.6e-06
        scale_factor: 2.
      embedding:
        lr: 0.001
        lr_final: 0.0001
      deform_network:
        lr: 1.6e-03
        lr_final: 1.6e-04
        scale_factor: 5.
      ins_rotation:
        lr: 0.00001
        lr_final: 0.000005
      ins_translation:
        lr: 0.0005
        lr_final: 0.0001
  SMPLNodes: 
    type: models.nodes.SMPLNodes
    init:
      only_moving: true
      traj_length_thres: 0.5
      annotator_masks: ../MaskPtAnnotator/annotator_output/{scene_idx:03d}/masks_npz # only instances with annotator masks
    reg:
      sharp_shape_reg:
        w: 1.
        step_interval: 10
        max_gauss_ratio: 10.
      temporal_smooth_reg:
        trans:
          w: 0.01 # optimal value may vary
          smooth_range: 5 # range of frames to consider for smoothing
        # joint_smooth:
        #   w: 0.01 # optimal value may vary
      knn_reg:
        # lambda_std_x: 0.0001
        lambda_std_q: 0.001
        lambda_std_s: 0.001
        lambda_std_o: 0.001
        lambda_std_shs_dc: 0.001
        lambda_std_shs_rest: 0.001
      max_s_square_reg:
        w: 0.05
      x_offset:
        w: 0.2
      voxel_deformer_reg:
        lambda_std_w: 0.6
        lambda_std_w_rest: 0.5
        lambda_w_norm: 0.6
        lambda_w_rest_norm: 0.3
    optim:
      xyz:
        lr: 1.6e-04
        lr_final: 1.6e-06
        scale_factor: 3.0
      rotation:
        lr: 0.005
      sh_dc:
        lr: 0.005
      sh_rest:
        lr: 0.00025
      ins_rotation:
        lr: 0.00001
        lr_final: 0.000005
      ins_translation:
        lr: 0.0005
        lr_final: 0.0001
      smpl_rotation:
        lr: 0.00005
        lr_final: 0.00001
      w_dc_vox:
        lr: 0.0001
        lr_final: 0.00001
        opt_after: 10000
    ctrl:
      sh_degree: 1
      opacity_init_value: 0.99
      ball_gaussians: false
      constrain_xyz_offset: false
      knn_update_interval: 100
      knn_neighbors: 3
      use_voxel_deformer: true
      test_interp: cubic # pose on held-out frames: linear | cubic | own | init_residual
      freeze_x: false
      freeze_o: false
      freeze_q: false
      freeze_s: false
      freeze_shs_dc: false
      freeze_shs_rest: false
  Sky:
    type: models.modules.EnvLight
    params:
      resolution: 1024
    optim:
      all:
        lr: 0.01
  Affine:
    type: models.modules.AffineTransform
    params:
      embedding_dim: 4
      base_mlp_layer_width: 64
      pixel_affine: False
    optim:
      all:
        lr: 1.0e-5
        weight_decay: 1.0e-6
  CamPose:
    type: models.modules.CameraOptModule
    optim:
      all:
        lr: 1.0e-5
        weight_decay: 1.0e-6

# ------------- render ------------ #
render:
  fps: 10 # frames per second for the main rendered output
  render_full: True # whether to render full resolution videos
  render_test: True # whether to render test set
  render_novel: 
    traj_types:
      - front_center_interp # type of trajectory for novel view synthesis
    fps: 24 # frames per second for novel view rendering
  vis_lidar: True # whether to visualize lidar points on ground truth images
  vis_sky: True # whether to include "rgb_sky" and "rgb_sky_blend" in rendered keys
  vis_error: False # whether to include "rgb_error_map" in rendered keys
  obj_geometry:
    observed_surface: true # also score mesh/gaussian accuracy on the surface held-out LiDAR rays could see
    observed_radius: 0.05 # a point is observed if a held-out ray passes this close (metres)
    max_rays: 30000 # rays per instance used for the test

# ------------- logging ------------ #
logging:
  vis_freq: 2000 # how often to visualize training stats
  print_freq: 500 # how often to print training stats
  saveckpt_freq: 5000 # how often to save checkpoints
  save_seperate_video: True # whether to save seperate videos for each scene